import org.gradle.api.DefaultTask
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.TaskAction

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

// ---------------------------------------------------------------------------
// 仓库根目录（= 安卓工程目录的上一级）。Python 源码与离线数据都在那儿，
// 不复制第二份，靠 build 阶段的 stageBundle 任务同步进 APK。
// ---------------------------------------------------------------------------
def repoRoot = rootProject.projectDir.parentFile
def repoWebDir = new File(repoRoot, "web")
def repoDataDir = new File(repoRoot, "data")
def repoAssetDir = new File(repoRoot, "assets")

// ---------------------------------------------------------------------------
// 把 web/ data/ assets/ 汇总成 assets/bundle/{web,data,assets}。
// BundleInstaller 按这个结构解到 filesDir/bundle，Python 那边通过
// MAGIA_BUNDLE_ROOT 指过去。
//
// 不能直接给 Sync 写死 into 路径、只靠 dependsOn 挂钩：
// AGP 在配置阶段就会扫描 assets 目录，全新 checkout 上目录还不存在，
// 对应任务被判 NO-SOURCE 直接跳过，最后打出一个只有 Python 运行时、
// 没有任何离线数据的空壳 APK（assets/bundle/ 条目数为 0）。
//
// 所以这里定义一个带 @OutputDirectory 属性的任务，交给
// AndroidComponents#addGeneratedSourceDirectory 绑定到 assets，
// 由 AGP 自己保证「先跑这个任务、再收集产物」。
// ---------------------------------------------------------------------------
abstract class StageBundleTask extends DefaultTask {

    // 用 @InputFiles 而不是 @InputDirectory：源目录缺失时由任务自己给出
    // 清晰的中文报错，而不是在配置阶段就被 Gradle 拒绝。
    @InputFiles
    abstract ConfigurableFileCollection getWebSources()

    @InputFiles
    abstract ConfigurableFileCollection getDataSources()

    @InputFiles
    abstract ConfigurableFileCollection getAssetSources()

    @OutputDirectory
    abstract DirectoryProperty getDestinationDir()

    @TaskAction
    void stage() {
        // AGP 的 addGeneratedSourceDirectory 会把 destinationDir 的「内容」并入
        // assets 根，目的地路径本身会被忽略（实际输出在
        // build/generated/assets/stageBundle）。所以真正的结构要建在 descDir 下面：
        //   <dest>/bundle/{web,data,assets}
        // 打进 APK 后就是 assets/bundle/{web,data,assets}，
        // 正是 BundleInstaller 读取的路径。
        def root = new File(destinationDir.get().asFile, "bundle")
        project.delete(destinationDir.get().asFile)
        root.mkdirs()
        copyInto("web", webSources.singleFile, new File(root, "web"))
        copyInto("data", dataSources.singleFile, new File(root, "data"))
        copyInto("assets", assetSources.singleFile, new File(root, "assets"))

        // 兜底自检：本次应该同步上千个文件，太少说明源目录是空的
        def files = []
        root.eachFileRecurse { f -> if (f.isFile()) files << f }
        logger.lifecycle("stageBundle: 已同步 ${files.size()} 个文件到 $root")
        if (files.size() < 100) {
            throw new GradleException("stageBundle 只同步了 ${files.size()} 个文件，源目录可能为空")
        }
    }

    private void copyInto(String label, File src, File dest) {
        if (!src.isDirectory()) {
            throw new GradleException("缺少源目录: $label/（$src）")
        }
        project.copy {
            from(src)
            into(dest)
        }
    }
}

android {
    namespace 'io.github.magiasaveeditor.android'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.magiasaveeditor.android"
        minSdk 24
        // 34 已完全强制分区存储；本应用全程走 SAF，不需要 MANAGE_EXTERNAL_STORAGE
        targetSdk 34
        versionCode 1
        versionName "1.0.0-android-personal"

        // 只打 arm64-v8a（个人使用分享的刻意选择）：Chaquo 每个 ABI 都要带一份
        // Python，双 ABI 体积翻倍。真要兼容 32 位老机再改成
        // "arm64-v8a, armeabi-v7a" 重编。
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // 用 debug 签名方便本地装包；正式发布请换成自己的 keystore。
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    androidResources {
        // 这些文件已经是最终形态，不需要 aapt 再加工，原样打包省时间
        noCompress += ["zip", "json", "png", "txt"]
    }

    // assets 的内容全部由下面的 stageBundle 生成并通过
    // addGeneratedSourceDirectory 挂进来；这里不能把仓库根塞进 srcDirs，
    // 否则 tests/ tools/ 甚至 .git 都会被当成 assets。
    sourceSets {
        main {
            assets.srcDirs = []
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
        // 后端只用 Python 标准库，pip 留空。将来引入第三方包时写在这里。
        pip {
        }
        pyc {
            // 生成 .pyc：启动快一点，也不至于源码被随便读走
            src = true
        }
        // pyc.src 需要用「主版本号与 target 相同」的宿主 Python 来编译 .pyc。
        // 本机 / CI 上的系统 python3 可能是 3.12/3.13/3.14，直接编译会报
        // "buildPython version X is incompatible"。这里允许用环境变量指定
        // 一个 3.11 的解释器（CI 里由 setup-python 提供）；不设则沿用默认查找。
        String pyHostPath = System.getenv("MAGIA_BUILD_PYTHON")
        if (pyHostPath != null && !pyHostPath.isEmpty()) {
            buildPython pyHostPath
        }
    }
    sourceSets {
        main {
            srcDirs = [repoRoot]
            // 只把 magiasave 包塞进 app.imy
            include "magiasave/**/*.py"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}

def bundleDir = layout.buildDirectory.dir("generated/bundle")

def stageBundle = tasks.register("stageBundle", StageBundleTask) {
    webSources.from(repoWebDir)
    dataSources.from(repoDataDir)
    assetSources.from(repoAssetDir)
    destinationDir.set(bundleDir)
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(stageBundle) { it.destinationDir }
    }
}