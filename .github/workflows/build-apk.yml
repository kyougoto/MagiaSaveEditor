name: Build APK

# 手动触发（Actions 页面点 Run workflow），推 v* tag 时也会自动出包。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Chaquopy 首次要下载 arm64 的 Python target（约 20 MB），加上 45 MB 资源打包，
    # 冷缓存大约 15-25 分钟，给足余量。
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 仓库里没有提交 gradle-wrapper.jar（二进制，按惯例不入库），
      # 所以这里现装一份 Gradle，再在 android/ 下生成 wrapper。
      # ---------------------------------------------------------------------
      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---------------------------------------------------------------------
      # Chaquopy 的 pyc.src 要求「宿主 Python 的主版本号 == target Python」，
      # 也就是编译 .pyc 必须用 3.11。ubuntu-latest 自带的是 3.12/3.14，
      # 直接构建会失败于：
      #   Failed to compile to .pyc format: buildPython version 3.x is incompatible
      # 所以这里装一个 3.11，并通过 MAGIA_BUILD_PYTHON 告诉 build.gradle 用它。
      # ---------------------------------------------------------------------
      - name: 准备宿主编译用 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 确认 Python 版本
        run: |
          python3 --version
          echo "MAGIA_BUILD_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          echo "已指定 buildPython: $(command -v python3)"

      - name: 生成 gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      # ---------------------------------------------------------------------
      # 缓存 Gradle 依赖（含 Chaquo 插件）与 Chaquo 下载的 Python target。
      # 注意：hashFiles 的路径是相对仓库根的，这里不要加 working-directory。
      # ---------------------------------------------------------------------
      - name: 缓存 Gradle 与 Chaquo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.chaquopy
            ~/.cache/chaquopy
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', '.github/workflows/build-apk.yml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 确认离线数据齐全
        run: |
          echo "web/     $(find web -type f | wc -l) 个文件"
          echo "data/    $(find data -type f | wc -l) 个文件, $(du -sh data | cut -f1)"
          echo "assets/  $(find assets -type f | wc -l) 个文件, $(du -sh assets | cut -f1)"
          # stageBundle 依赖这三个目录，缺了会打出空壳 APK，先挡住
          for d in web data assets; do
            test -d "$d" || { echo "::error::缺少 $d/"; exit 1; }
          done
          echo "--- assets/ 顶层 ---"
          ls assets | head
          echo "--- data/ 顶层 ---"
          ls data | head
          echo "--- 大小合计 ---"
          du -sh web data assets | tail -3

      - name: 构建 APK
        working-directory: android
        run: |
          set -o pipefail
          TASK=assembleDebug
          if [ "${{ inputs.build_type }}" = "release" ]; then TASK=assembleRelease; fi
          echo "执行 ./gradlew $TASK"
          # --no-daemon + 并行执行会让 Kotlin 插件计算 friendPathsSet 时跨线程
          # 访问 root project 状态，触发
          #   IllegalStateException: Current thread does not hold the state lock
          # 单模块工程并行本来也没收益，这里显式关掉。
          ./gradlew "$TASK" --no-daemon --no-parallel --stacktrace

      - name: 校验产物
        working-directory: android
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::没有生成 APK"; exit 1; fi
          echo "APK: $APK"
          ls -lh "$APK"

          # 用 unzip -Z1（只列名字，不截断）统计，不要用 unzip -l 的表格输出：
          # 表格会把长路径折行/截断，grep 计数不可靠。
          unzip -Z1 "$APK" > /tmp/apk_entries.txt
          echo "APK 总条目: $(wc -l < /tmp/apk_entries.txt)"

          echo "--- lib/ 下的 ABI（应只有 arm64-v8a）---"
          grep '^lib/' /tmp/apk_entries.txt | cut -d/ -f2 | sort -u | tee /tmp/abi.txt
          if [ "$(wc -l < /tmp/abi.txt)" -ne 1 ] || [ "$(cat /tmp/abi.txt)" != "arm64-v8a" ]; then
            echo "::error::ABI 不符合预期（应只有 arm64-v8a）"
            exit 1
          fi

          echo "--- assets/bundle/ 条目数 ---"
          N=$(grep -c '^assets/bundle/' /tmp/apk_entries.txt || true)
          echo "$N"
          # web/ 只有 3 个文件、data/ 23 个、assets/ 2600+ 个，正常总量应在 2600 以上。
          # 低于此说明 stageBundle 没把内容塞进 APK，属于空壳包，必须拦住。
          if [ "$N" -lt 1000 ]; then
            echo "::error::assets/bundle/ 只有 $N 个条目，离线数据没有打进去"
            echo "--- APK 内 assets 顶层分布 ---"
            grep '^assets/' /tmp/apk_entries.txt | cut -d/ -f1-3 | sort | uniq -c | sort -rn | head -20
            echo "--- stageBundle 产物（AGP 实际输出目录）---"
            find app/build/generated -maxdepth 4 -type d 2>/dev/null | head -20 || true
            echo "--- 其中文件数 ---"
            find app/build/generated -type f 2>/dev/null | wc -l || true
            exit 1
          fi
          echo "样例："
          grep '^assets/bundle/' /tmp/apk_entries.txt | head -3

          echo "--- Python 运行时与源码包 ---"
          echo "assets/chaquopy/ 条目数: $(grep -c '^assets/chaquopy/' /tmp/apk_entries.txt || true)"
          grep -E '^assets/chaquopy/app\.imy' /tmp/apk_entries.txt || {
            echo "::error::assets/chaquopy/app.imy 缺失，Python 源码没打进去"
            exit 1
          }

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MagiaSaveEditor-${{ inputs.build_type || 'debug' }}-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 失败时保留报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 7